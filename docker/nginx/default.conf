# Bloque principal del sitio que atendera Nginx.
server {
    # Nginx escucha dentro del contenedor en el puerto HTTP estandar.
    listen 80;
    # Nombre usado para resolver el sitio. El acceso externo se publica
    # desde Docker, por ejemplo, como http://localhost:8080.
    server_name localhost;

    # Laravel solo debe exponer public/, nunca la raiz completa del proyecto.
    root /var/www/html/public;
    # index.php es el punto de entrada de Laravel; index.html queda como
    # alternativa para archivos estaticos si existieran.
    index index.php index.html;

    # Todas las solicitudes pasan primero por el enrutador de Laravel si no
    # corresponden a un archivo o directorio fisico.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Envia los archivos PHP al servicio PHP-FPM llamado app en Compose.
    location ~ \.php$ {
        # Parametros estandar necesarios para que PHP-FPM interprete la peticion.
        include fastcgi_params;
        # app:9000 es la red interna Docker, no un puerto publicado al host.
        fastcgi_pass app:9000;
        # Indica a PHP-FPM que ejecute el archivo solicitado dentro de public/.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Conserva la informacion adicional de ruta enviada a PHP.
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Bloquea archivos ocultos como .env, .git y configuraciones privadas.
    # Se permite la excepcion .well-known, usada habitualmente por HTTPS.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}