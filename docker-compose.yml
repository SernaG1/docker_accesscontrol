services:
  init:
    image: accesscontrol_app
    container_name: accesscontrol_init
    working_dir: /var/www/html
    env_file:
      - .env
    command: >-
      sh -c "php artisan migrate --force && php artisan db:seed --class=AdminSeeder --force && php artisan storage:link --force"
    volumes:
      - app_code:/var/www/html
      - storage_data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - accesscontrol

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: accesscontrol_app
    container_name: accesscontrol_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - accesscontrol
    volumes:
      - app_code:/var/www/html
      - storage_data:/var/www/html/storage

  queue:
    image: accesscontrol_app
    container_name: accesscontrol_queue
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - accesscontrol
    volumes:
      - app_code:/var/www/html
      - storage_data:/var/www/html/storage

  scheduler:
    image: accesscontrol_app
    container_name: accesscontrol_scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    command: php artisan schedule:work
    volumes:
      - app_code:/var/www/html
      - storage_data:/var/www/html/storage
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - accesscontrol

  nginx:
    image: nginx:1.27-alpine
    container_name: accesscontrol_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - app_code:/var/www/html:ro
      - storage_data:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - accesscontrol

  db:
    image: mysql:8.4
    container_name: accesscontrol_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: accesscontrol
      MYSQL_USER: accesscontrol
      MYSQL_PASSWORD: accesscontrol_password
      MYSQL_ROOT_PASSWORD: root_password_change_me
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_password_change_me"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - accesscontrol

volumes:
  app_code:
  mysql_data:
  storage_data:

networks:
  accesscontrol:
    driver: bridge